# set Run/Debug Configuration > Application arguments > VM options: -Dspring.profiles.active=local
spring:
  application:
    name: itsectest

  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:your_port/your_db_name
    username: your_db_user
    password: your_db_password
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

#logging:
#  level:
#    root: DEBUG
#    org.springframework: DEBUG

server:
  port: 8080

security:
  jwt:
    secret: your-secret
    access-token-ttl-minutes: your-ttl-access
    refresh-token-ttl-days: your-ttl-refresh

  pii:
    key: your-pii-key
    hash-salt: your-hash-salt

app:
  auth:
    email-verification-base-url: "http://localhost:8080/api/auth/email-verification"
    email-verification-ttl-hours: 24