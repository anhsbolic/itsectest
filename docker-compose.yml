  db:
    image: postgres:16-alpine
    container_name: itsectest-db
    environment:
      POSTGRES_DB: ${DB_NAME:-itsectest}
      POSTGRES_USER: ${DB_USERNAME:-itsectest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itsectest}
    ports:
      - "5433:5432"
    volumes:
      - itsectest_pgdata:/var/lib/postgresql/data
    networks:
      - itsectest-net

  redis:
    image: redis:7-alpine
    container_name: itsectest-redis
    ports:
      - "6379:6379"
    networks:
      - itsectest-net

